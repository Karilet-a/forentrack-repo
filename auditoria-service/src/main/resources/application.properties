spring.application.name=auditoria-service
server.port=${PORT:8085}

# Base MongoDB propia del servicio
spring.data.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/auditoria_db}
spring.mongodb.uri=${MONGODB_URI:mongodb://127.0.0.1:27017/auditoria_db}
spring.data.mongodb.auto-index-creation=true

# Secreto compartido por los 6 servicios (mínimo 32 caracteres). El valor por defecto es SOLO para
# desarrollo local; en Render/producción define JWT_SECRET con un valor propio y distinto.
app.jwt.secret=${JWT_SECRET:forentrack-dev-secret-solo-desarrollo-2026-no-usar-en-produccion}

springdoc.swagger-ui.path=/swagger-ui.html

# Conexión local a Atlas (archivo ignorado por git; opcional)
spring.config.import=optional:classpath:local-mongo.properties
